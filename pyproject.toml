[project]
name = "voice-assistant"
version = "1.0.0"
description = "Personal AI voice assistant for Sabith S B: a LiveKit agent (Gemini Live API) reachable by phone, web widget, or any LiveKit client, with a FastAPI service for tokens, transcripts, and messages"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sabith S B", email = "saabith.sb@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[google]~=1.5",
    "livekit-api>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Portfolio = "https://sabithsb.fermyon.app/"
Repository = "https://github.com/s4b11/livekit-ivr"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

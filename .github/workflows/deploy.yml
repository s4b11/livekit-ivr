name: Deploy

# Deploys everything after CI passes, using only GitHub secrets:
#   1. the Cloudflare Worker (React UI, embed widget, token + storage API, D1)
#   2. the agent worker on LiveKit Cloud, pointed at that Worker
# Setup is described in docs/deployment.md. A target whose secrets are missing
# is skipped with a warning instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "contract/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "livekit.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  web:
    name: Deploy to Cloudflare
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: config
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set - skipping the Cloudflare deploy (see docs/deployment.md)."
          fi

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: Create the D1 database if needed
        if: steps.config.outputs.ready == 'true'
        run: node scripts/ensure-d1.mjs

      - name: Apply database migrations
        if: steps.config.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build
        if: steps.config.outputs.ready == 'true'
        run: npm run build

      - name: Deploy the Worker
        id: deploy
        if: steps.config.outputs.ready == 'true'
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          npx wrangler deploy | tee deploy.log
          url="${PUBLIC_BASE_URL:-$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)}"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${url%/}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set Worker secrets
        if: steps.config.outputs.ready == 'true'
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          jq -n '{
            LIVEKIT_URL: env.LIVEKIT_URL,
            LIVEKIT_API_KEY: env.LIVEKIT_API_KEY,
            LIVEKIT_API_SECRET: env.LIVEKIT_API_SECRET,
            BACKEND_API_KEY: env.BACKEND_API_KEY
          } | with_entries(select(.value != ""))' > "$RUNNER_TEMP/worker-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

  agent:
    name: Deploy to LiveKit Cloud
    needs: [ci, web]
    # Still deploy the agent when the Cloudflare step was skipped, but not when it failed.
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.web.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # commits livekit.toml the first time the agent is created
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      # The agent's runtime environment. LiveKit Cloud injects the LIVEKIT_* values itself.
      SECRET_LIST: >-
        GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},BACKEND_BASE_URL=${{ needs.web.outputs.url || vars.PUBLIC_BASE_URL }},BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check LiveKit secrets
        id: config
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$LIVEKIT_URL" ] || [ -z "$LIVEKIT_API_KEY" ] || [ -z "$LIVEKIT_API_SECRET" ] || [ -z "$GOOGLE_API_KEY" ]; then
            echo "::warning::LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET / GOOGLE_API_KEY are not all set - skipping the agent deploy (see docs/deployment.md)."
          elif [ -f livekit.toml ]; then
            echo "operation=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "operation=create" >> "$GITHUB_OUTPUT"
          fi

      # Talk to the configured Gemini Live model before shipping anything, so a bad
      # model name, key, or setting fails here and the running agent stays in place.
      - uses: astral-sh/setup-uv@v6
        if: steps.config.outputs.operation != ''
        with:
          enable-cache: true

      - name: Smoke-test the Gemini Live model
        if: steps.config.outputs.operation != ''
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python scripts/smoke_realtime.py

      # First run only: registers the agent, deploys it, and writes livekit.toml.
      - name: Create agent
        if: steps.config.outputs.operation == 'create'
        uses: livekit/deploy-action@v2.12.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          OPERATION: create

      - name: Commit livekit.toml
        if: steps.config.outputs.operation == 'create'
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add livekit.toml
          git commit -m "Add LiveKit agent config"
          git push

      - name: Deploy agent
        if: steps.config.outputs.operation == 'deploy'
        uses: livekit/deploy-action@v2.12.2
        with:
          OPERATION: deploy

      - name: Wait for the new version to be running
        if: steps.config.outputs.operation != ''
        uses: livekit/deploy-action@v2.12.2
        with:
          OPERATION: status-retry
          TIMEOUT: 10m

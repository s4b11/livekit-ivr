name: Portfolio

# Builds the portfolio site on every change to portfolio/, and deploys it to
# Cloudflare Pages (project "sabithsb") from main. Uses the same
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as the Worker deploy;
# the token needs the "Cloudflare Pages: Edit" permission.

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio.yml"
  pull_request:
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: sabithsb

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Check Cloudflare secrets
        id: config
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare secrets are not set - skipping the Pages deploy."
          fi

      - name: Create the Pages project if needed
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Pages project $PAGES_PROJECT exists"
          else
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true | tee deploy.log
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | head -n 1 >> "$GITHUB_STEP_SUMMARY"

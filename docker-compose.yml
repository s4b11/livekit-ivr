# Local development services. The agent itself runs on LiveKit Cloud (or `uv run`).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: voice_assistant
    ports:
      - "5433:5432" # 5433 on the host avoids clashing with a native PostgreSQL
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d voice_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
